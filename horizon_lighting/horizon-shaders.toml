[[post]]
file = "post/reflections.wgsl"
files = ["gloss.wgsl"]
name = "Glossy surface reflections"
output = "surface_reflection"
scale = 0.5

[[post]]
file = "post/atmosphere.wgsl"
files = ["shadow.wgsl"]
name = "Volumetric sunlight"
output = "atmosphere"
scale = 0.5

[[post]]
file = "post/contact_ao.wgsl"
files = ["gloss.wgsl"]
name = "Contact ambient occlusion"
output = "contact_occlusion"
scale = 0.5

[[post]]
file = "post/bloom_extract.wgsl"
files = ["gloss.wgsl"]
name = "Bloom extraction"
output = "bloom_source"
scale = 0.25

[[post]]
file = "post/bloom_horizontal.wgsl"
files = ["post/bloom_blur.wgsl"]
name = "Bloom horizontal"
output = "bloom_horizontal"
scale = 0.25

[[post]]
file = "post/bloom_vertical.wgsl"
files = ["post/bloom_blur.wgsl"]
name = "Bloom vertical"
output = "bloom_vertical"
scale = 0.25

[[post]]
file = "post/composite.wgsl"
files = ["gloss.wgsl", "fog.wgsl"]
name = "Atmosphere and bloom"

[[post]]
file = "post/antialias.wgsl"
name = "Edge smoothing"

[tonemap]
file = "tonemap.wgsl"
name = "Artistic grading and highlights"

[[options]]
id = "quality_preset"
name = "Quality preset"
type = "choice"
values = ["Lite", "Balanced", "High", "Ultra"]
default = "Balanced"
description = "Lite: Maximum performance. Balanced: Recommended for most players. High: Enhanced visual quality. Ultra: Maximum visual fidelity with full-strength sun beams."

[[pages]]
id = "main"
name = "Horizon Lighting"
columns = 1
items = ["quality_preset"]

[budget]
gpu_ms = 4.0
