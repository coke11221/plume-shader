schema = 1
id = "plume_shader"
name = "Plume Shader"
version = "0.7.8"
api = "0.2"
description = "Raster-only Horizon shader pack featuring golden-hour sunlight, volumetric clouds, directional sky and haze, waving foliage, colored volumetric and dynamic block lighting, planar water mirror and SSR, wet and polished surfaces, custom rain and snow, bloom, and four quality presets."
authors = ["coke"]
license = "MIT"
shared = ["common.wgsl"]

[frame]
blend = "linear"
fog = "pack"

[sky]
file = "sky.wgsl"
name = "Directional sky"
clouds = false
sun = false

[material]
file = "material.wgsl"
files = ["shadow.wgsl", "gloss.wgsl", "fog.wgsl", "lighting.wgsl", "water.wgsl"]
name = "Terrain and water"
coverage = "pack"

[vertex]
file = "vertex.wgsl"
name = "Foliage wind"

[weather]
file = "weather.wgsl"
name = "Rain and snow"

[entity]
file = "entity.wgsl"
files = ["shadow.wgsl", "gloss.wgsl", "fog.wgsl", "lighting.wgsl"]
name = "Entity lighting"

[shadow]
resolution = 2048
distance = 96.0

[reflection]

[[textures]]
id = "water_normal"
file = "water-normal.png"
filter = "linear"
wrap = "repeat"

[[textures]]
id = "cloud_noise"
file = "cloud-noise.png"
filter = "linear"
wrap = "repeat"

